<div class="flex flex-col gap-1">
  <label class="font-ui text-sm font-medium leading-5 text-text-primary" id="variant-selector-label">
    Variante de náhuatl
  </label>
  <select
    class="h-10 w-full rounded-lg border border-border-subtle bg-card px-3 text-sm shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
    aria-labelledby="variant-selector-label"
    [value]="selected()"
    (change)="selected.set($any($event.target).value)"
  >
    <option value="" disabled>Selecciona una variante</option>
    @for (variant of variants(); track variant.id) {
      <option [value]="variant.id">{{ variantName(variant) }}</option>
    }
  </select>
</div>
