<section
  class="flex flex-col gap-3 rounded-xl border border-primary-200 bg-primary-100 px-4 py-4 shadow-sm"
  aria-labelledby="guest-banner-title"
>
  <div class="flex items-center gap-2">
    <span class="lucide--user-round shrink-0 text-lg text-primary" aria-hidden="true"></span>
    <h2 id="guest-banner-title" class="text-sm font-semibold text-primary">
      Estás contribuyendo como invitado
    </h2>
  </div>

  <p class="text-xs leading-5 text-muted-foreground">
    Crea una cuenta o inicia sesión para no perder tu progreso. Tu trabajo se conservará y quedará
    vinculado a tu cuenta.
  </p>

  <button z-button zType="default" zSize="sm" zFull type="button" (click)="goToSignup()">
    <span class="lucide--user-plus size-4" aria-hidden="true"></span>
    Crear cuenta o iniciar sesión
  </button>
</section>
