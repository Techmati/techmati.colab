<article class="rounded-xl border border-border-subtle bg-surface-card p-4 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <h3 class="text-secondary-foreground text-base font-medium leading-8">
      {{ card().phraseSet.title }}
    </h3>
    <p class="text-text-tertiary text-xs leading-5">
      {{ card().phraseSet.publishedAt | date: "d 'de' MMMM yyyy" : '' : 'es-MX' }}
    </p>
  </div>

  <div class="mt-2 flex items-center gap-2">
    <span
      class="bg-brand-green-100/55 border-2 border-brand-green-300/40 rounded-md font-medium text-brand-green-600 text-sm px-1 py-0.5"
    >
      {{ card().inProgress ? 'En progreso' : 'Completado' }}
    </span>
    <span class="text-text-secondary text-sm font-medium leading-5"
      >• {{ card().lastUpdate | timeAgo }}</span
    >
  </div>

  <p class="text-text-tertiary mt-1 text-sm leading-5">{{ card().phraseSet.phraseCount }}</p>

  <div class="mt-3 flex items-center justify-end gap-2">
    <button z-button zType="outline" zSize="sm" (click)="goToDetails()">
      <span class="lucide--notebook-pen" aria-hidden="true"></span>
      Detalles
    </button>
  </div>
</article>
