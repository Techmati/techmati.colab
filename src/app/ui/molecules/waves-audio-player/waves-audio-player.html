<div
  class="audio-player rounded-full border border-border bg-card px-4 py-2 shadow-sm"
  [class.audio-player--card]="variant() === 'card'"
  [class.audio-player--panel]="variant() === 'panel'"
>
  <button
    type="button"
    class="play-btn"
    [attr.aria-label]="playing() ? 'Pausar audio' : 'Reproducir audio'"
    (click)="togglePlayback()"
  >
    <span
      [class]="playing() ? 'lucide--pause size-4 text-white' : 'lucide--play size-4 text-white'"
      aria-hidden="true"
    ></span>
  </button>

  <div class="waveform-shell mx-3 flex-1 overflow-hidden">
    <div #waveform class="waveform"></div>
  </div>

  <span class="text-sm leading-4 text-muted-foreground">
    @if (variant() === 'card') {
      {{ durationLabel }}
    } @else if (variant() === 'panel') {
      {{ durationLabel }}
    } @else {
      {{ elapsedLabel }} / {{ durationLabel }}
    }
  </span>
</div>
