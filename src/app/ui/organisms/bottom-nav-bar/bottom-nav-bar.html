<nav
  class="bottom-nav-bar bg-card fixed inset-x-0 bottom-0 z-10 h-16 border-t border-border"
  aria-label="Navegación principal"
>
  <ul class="mx-auto h-full max-w-sm flex justify-center">
    <li class="min-w-28 md:min-w-33">
      @let dashboardActive = active() === 'dashboard';
      <a
        class="text-muted-foreground flex flex-col items-center justify-center gap-1 text-sm sm:text-base border-t-2 border-solid border-transparent p-2"
        [class.item-active]="dashboardActive"
        routerLink="/dashboard"
      >
        <span
          [class]="dashboardActive ? 'ri--dashboard-fill' : 'ri--dashboard-line'"
          aria-hidden="true"
        ></span>
        Dashboard
      </a>
    </li>
    <li class="md:min-w-33 min-w-28">
      @let profileActive = active() === 'profile';
      <a
        class="text-muted-foreground flex flex-col items-center justify-center gap-1 text-sm sm:text-base border-t-2 border-solid border-transparent p-2"
        [class.item-active]="profileActive"
        routerLink="/profile"
      >
        <span [class]="profileActive ? 'ri--user-fill' : 'ri--user-line'" aria-hidden="true"></span>
        Perfil
      </a>
    </li>
    @if (canManageContributors()) {
      <li class="md:min-w-33 min-w-28">
        @let contributorsActive = active() === 'contributors';
        <a
          class="text-muted-foreground flex flex-col items-center justify-center gap-1 border-t-2 border-solid border-transparent p-2 text-sm sm:text-base"
          [class.item-active]="contributorsActive"
          routerLink="/contributors"
        >
          <span
            [class]="contributorsActive ? 'lucide--book-user' : 'lucide--book-user'"
            aria-hidden="true"
          ></span>
          Colaboradores
        </a>
      </li>
    }
  </ul>
</nav>
