<nav
  class="fixed inset-x-0 bottom-0 z-20 border-t border-border-subtle bg-card/95 shadow-lg backdrop-blur"
  aria-label="Navegación de administración"
>
  <div class="mx-auto grid h-16 max-w-3xl grid-cols-4">
    <a
      class="flex flex-col items-center justify-center gap-1 px-2 text-xs font-medium text-text-secondary transition-colors hover:bg-surface-soft hover:text-primary"
      routerLink="/admin/dashboard"
      [routerLinkActive]="[
        'border-t-2',
        'border-primary',
        'bg-brand-purple-50/60',
        '!font-bold',
        '!text-primary'
      ]"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <span class="ri--dashboard-line text-xl" aria-hidden="true"></span>
      Inicio
    </a>

    <a
      class="flex flex-col items-center justify-center gap-1 px-2 text-xs font-medium text-text-secondary transition-colors hover:bg-surface-soft hover:text-primary"

      [routerLinkActive]="[
        'border-t-2',
        'border-primary',
        'bg-brand-purple-50/60',
        '!font-bold',
        '!text-primary'
      ]"
      ariaCurrentWhenActive="page"
    >
      <span class="ri--file-text-line text-xl" aria-hidden="true"></span>
      Frases
    </a>

    <a
      class="flex flex-col items-center justify-center gap-1 px-2 text-xs font-medium text-text-secondary transition-colors hover:bg-surface-soft hover:text-primary"
      routerLink="/admin/translations"
      [routerLinkActive]="[
        'border-t-2',
        'border-primary',
        'bg-brand-purple-50/60',
        '!font-bold',
        '!text-primary'
      ]"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <span class="ri--translate-2 text-xl" aria-hidden="true"></span>
      Traducciones
    </a>

    <a
      class="flex flex-col items-center justify-center gap-1 px-2 text-xs font-medium text-text-secondary transition-colors hover:bg-surface-soft hover:text-primary"
      routerLink="/admin/users"
      [routerLinkActive]="[
        'border-t-2',
        'border-primary',
        'bg-brand-purple-50/60',
        '!font-bold',
        '!text-primary'
      ]"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <span class="ri--admin-line text-xl" aria-hidden="true"></span>
      Usuarios
    </a>
  </div>
</nav>
