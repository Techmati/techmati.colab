<header class="sticky top-0 z-20 border-b border-border-subtle bg-card/95 backdrop-blur">
  <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between gap-3 px-4">
    <div class="flex min-w-0 items-center gap-2">
      <span class="game-icons--hummingbird text-3xl text-primary" aria-hidden="true"></span>
      <p class="font-display text-xl font-bold leading-none">
        <span class="text-primary">Tech</span><span class="text-brand-green-600">mati</span>
      </p>
    </div>

    <div class="flex items-center gap-2">
      @if (profileQuery.isPending()) {
        <z-skeleton class="h-7 w-32 rounded-full" />
      } @else {
        <span
          class="inline-flex items-center gap-1.5 rounded-full bg-brand-purple-100 px-3 py-1 text-xs font-semibold text-primary"
        >
          <span class="ri--shield-user-line text-base" aria-hidden="true"></span>
          {{ roleLabel() }}
        </span>
      }

      @if (contributorLoading()) {
        <z-skeleton class="hidden h-7 w-16 rounded-full min-[380px]:block" />
      } @else if (activeContributorFirstName()) {
        <z-badge
          zShape="pill"
          class="hidden h-7 gap-1.5 border-brand-green-200 bg-brand-green-100 px-2.5 text-brand-green-600 shadow-sm min-[380px]:inline-flex"
        >
          <span class="lucide--user-round text-sm" aria-hidden="true"></span>
          {{ activeContributorFirstName() }}
        </z-badge>
      }

      <button
        z-button
        zType="ghost"
        zSize="icon"
        type="button"
        aria-label="Cerrar sesión"
        class="text-text-secondary hover:text-primary"
        [zLoading]="isSigningOut()"
        [zDisabled]="isSigningOut()"
        (click)="logout()"
      >
        <span class="ri--logout-box-r-line text-xl" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
