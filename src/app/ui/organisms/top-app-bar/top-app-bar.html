<header class="sticky top-0 z-20 border-b border-border bg-card/95 backdrop-blur">
  <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between gap-3 px-4">
    <div class="flex min-w-0 items-center gap-2">
      <span class="game-icons--hummingbird text-3xl text-primary" aria-hidden="true"></span>
      <p class="font-display text-xl font-bold leading-none">
        <span class="text-primary">Tech</span><span class="text-primary-600">mati</span>
      </p>
    </div>

    <div class="flex items-center gap-2">
      @if (isGuest()) {
        <span
          class="inline-flex items-center gap-1.5 rounded-full bg-primary-100 px-3 py-1 text-xs font-semibold text-primary"
        >
          <span class="lucide--user-round text-base" aria-hidden="true"></span>
          Invitado
        </span>

        <button
          z-button
          routerLink="/signup"
          class="inline-flex items-center gap-1.5 rounded-full bg-primary-600 px-3 py-1 text-xs font-semibold text-white"
        >
          <span class="lucide--user-plus text-base" aria-hidden="true"></span>
          Crear cuenta
        </button>
      } @else {
        @if (profileQuery.isPending()) {
          <z-skeleton class="h-7 w-32 rounded-full" />
        } @else if(canAcessAdminPanel()){
          <button
            z-button
            routerLink="/admin/dashboard"
            class="inline-flex items-center gap-1.5 rounded-full bg-primary-100 px-3 py-1 text-xs font-semibold text-primary hover:text-primary-foreground text-wrap shrink"
          >
            <span class="ri--shield-user-line text-base" aria-hidden="true"></span>
            <span class="hidden sm:block"> {{ roleLabel() }} </span>
            <span class="sm:hidden"> {{ roleLabelInitials() }} </span>
          </button>
        }

        @if (contributorLoading()) {
          <z-skeleton class="h-7 w-16 rounded-full sm:w-6" />
        } @else if (canManageContributors() && activeContributorFirstName(); as contributorFirstName) {
          <button
            z-button
            class="h-7 gap-1.5 border-primary-200 bg-primary-100 px-2.5 text-primary-600 shadow-sm rounded-xl hover:bg-primary-400 hover:text-primary-50"
            routerLink="/dashboard"
          >
            <span class="lucide--user-round text-sm" aria-hidden="true"></span>
            <span class="hidden sm:block">
              {{ contributorFirstName }}
            </span>
            <span class="sm:hidden">{{activeContributorInitials()}}</span>
          </button>
        }

        <button
          z-button
          zType="ghost"
          zSize="icon"
          type="button"
          aria-label="Cerrar sesión"
          class="text-muted-foreground hover:text-primary"
          [zLoading]="isSigningOut()"
          [zDisabled]="isSigningOut()"
          (click)="logout()"
        >
          <span class="ri--logout-box-r-line text-xl" aria-hidden="true"></span>
        </button>
      }
    </div>
  </div>
</header>
