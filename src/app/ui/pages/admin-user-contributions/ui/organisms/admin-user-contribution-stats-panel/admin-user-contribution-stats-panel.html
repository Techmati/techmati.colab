<article class="rounded-2xl border border-border bg-card p-5 shadow-sm shadow-primary/10">
  @if (isLoading()) {
    <div class="grid w-full grid-cols-2 gap-3">
      <z-skeleton class="h-24 rounded-xl" />
      <z-skeleton class="h-24 rounded-xl" />
      <z-skeleton class="h-24 rounded-xl" />
      <z-skeleton class="h-24 rounded-xl" />
    </div>
  } @else {
    <div class="grid w-full grid-cols-2 gap-3">
      <section class="rounded-xl bg-primary/10 px-3 py-4 text-center">
        <strong class="block font-display text-3xl font-bold leading-9 text-primary">
          {{ stats()?.entriesCount ?? 0 }}
        </strong>
        <span class="text-xs font-medium leading-4 text-muted-foreground">Entradas</span>
      </section>

      <section class="rounded-xl bg-brand-green-100 px-3 py-4 text-center">
        <strong class="block font-display text-3xl font-bold leading-9 text-brand-green-600">
          {{ stats()?.completedAttempts ?? 0 }}
        </strong>
        <span class="text-xs font-medium leading-4 text-muted-foreground">Intentos completados</span>
      </section>

      <section class="rounded-xl bg-muted px-3 py-4 text-center">
        <strong class="block font-display text-3xl font-bold leading-9 text-foreground">
          {{ stats()?.thisWeekCount ?? 0 }}
        </strong>
        <span class="text-xs font-medium leading-4 text-muted-foreground">Esta semana</span>
      </section>

      <section class="rounded-xl bg-muted px-3 py-4 text-center">
        <strong class="block font-display text-3xl font-bold leading-9 text-foreground">
          {{ stats()?.todayCount ?? 0 }}
        </strong>
        <span class="text-xs font-medium leading-4 text-muted-foreground">Hoy</span>
      </section>
    </div>
  }
</article>
