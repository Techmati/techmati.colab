<header class="sticky top-0 z-20 border-b border-border bg-card/95 shadow-sm backdrop-blur">
  <div class="relative mx-auto flex h-20 w-full max-w-3xl items-center justify-center px-14">
    <button
      z-button
      zType="ghost"
      zSize="icon"
      zShape="circle"
      type="button"
      class="absolute left-3 text-foreground"
      aria-label="Volver"
      (click)="goBack()"
    >
      <span class="lucide--x text-xl" aria-hidden="true"></span>
    </button>

    <div class="min-w-0 text-center">
      <p class="text-xs font-medium leading-4 text-muted-foreground">Usuario</p>
      <p class="truncate text-xs font-medium leading-4 text-muted-foreground">
        {{ userName() || 'Cargando usuario' }}
      </p>
      <h1 class="font-display text-2xl font-bold leading-8 text-primary">Contribuciones</h1>
    </div>
  </div>
</header>
