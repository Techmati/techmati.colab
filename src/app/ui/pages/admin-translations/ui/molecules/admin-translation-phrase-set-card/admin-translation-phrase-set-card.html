<a
  class="group relative block overflow-hidden rounded-xl border border-[#d3e4fe] bg-card p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-md"
  [routerLink]="['/admin', 'phrase-sets', phraseSet().id, 'translations']"
>
  <span
    class="absolute inset-y-0 left-0 w-1 bg-primary opacity-0 transition-opacity group-hover:opacity-100"
    aria-hidden="true"
  ></span>

  <article class="space-y-4">
    <header class="flex items-start justify-between gap-3">
      <h3 class="font-display text-xl font-semibold leading-7 text-primary">
        {{ phraseSet().title }}
      </h3>
      <span class="lucide--chevron-right mt-1 text-xl text-brand-purple-200" aria-hidden="true"></span>
    </header>

    <p class="line-clamp-2 text-base leading-6 text-text-secondary">
      {{ phraseSet().description }}
    </p>

    <footer class="flex flex-wrap items-center gap-2 border-t border-[#d3e4fe] pt-4">
      <span class="inline-flex items-center gap-1 text-xs font-medium leading-4 text-text-secondary">
        <span class="ri--list-check-2 text-sm text-primary" aria-hidden="true"></span>
        {{ phraseSet().phraseCount }} frases
      </span>
      <span class="text-xs font-medium leading-4 text-[#c8c4d7]" aria-hidden="true">•</span>
      <span class="inline-flex items-center gap-1 text-xs font-medium leading-4 text-text-secondary">
        <span class="ri--group-line text-sm text-brand-green-600" aria-hidden="true"></span>
        {{ contributorsCount() }} usuarios contribuyendo
      </span>
      <span class="text-xs font-medium leading-4 text-[#c8c4d7]" aria-hidden="true">•</span>
      <z-badge zShape="pill" class="gap-1">
        <span class="ri--hospital-line text-xs" aria-hidden="true"></span>
        {{ categoryLabel() }}
      </z-badge>
    </footer>
  </article>
</a>
