<section
  class="rounded-xl border border-[var(--border)] bg-card p-4 shadow-sm"
  aria-label="Búsqueda y filtros de traducciones"
>
  <div class="space-y-1">
    <div class="space-y-1">
      <span class="flex items-center gap-1 text-xs font-medium leading4 text-muted-foreground">
        <span class="lucide--search"></span>
        Buscar
      </span>
      <z-input-group [zAddonBefore]="searchIcon" [zAddonAfter]="search() ? clearSearch : ''" class="bg-card shadow-sm">
        <input
          z-input
          placeholder="Buscar conjuntos..."
          class="h-9 rounded-lg bg-card text-sm shadow-sm"
          [(ngModel)]="search"
        />
      </z-input-group>
    </div>

    <z-accordion zDefaultValue="filters">
      <z-accordion-item zTitle="Filtros" zValue="filters" zIcon="lucide--filter">
        <div class="space-y-2">

          <div class="space-y-1">
            <span class="flex items-center gap-1 text-xs font-medium leading4 text-muted-foreground">
              <span class="lucide--list-ordered"></span>
              Ordenar por
            </span>
            <z-select
              class="w-full"
              zPlaceholder="Ordenar por"
              [zValue]="sortOption()"
              (zSelectionChange)="selectSort($event)"
            >
              @for (option of sortOptions; track option.value) {
                <z-select-item [zValue]="option.value">{{ option.label }}</z-select-item>
              }
            </z-select>
          </div>

          <div class="space-y-1">
            <span class="flex items-center gap-1 text-xs font-medium leading4 text-muted-foreground">
              <span class="ri--hospital-line"></span>
              Categoría
            </span>
            <z-select
              class="w-full"
              zPlaceholder="Categoría"
              [zValue]="category()"
              (zSelectionChange)="selectCategory($event)"
            >
              @for (opt of categoryOptions; track opt.value) {
                <z-select-item [zValue]="opt.value">{{ opt.label }}</z-select-item>
              }
            </z-select>
          </div>

          <div class="space-y-1">
            <span class="flex items-center gap-1 text-xs font-medium leading4 text-muted-foreground">
              <span class="ri--group-line"></span>
              Contribuciones
            </span>
            <z-input-group
              [zAddonBefore]="contributorsIcon"
              [zAddonAfter]="contributorsSuffix"
            >
              <input
                z-input
                type="number"
                inputmode="numeric"
                min="1"
                placeholder="..."
                class="text-center"
                [ngModel]="minContributors()"
                (ngModelChange)="updateMinContributors($event)"
              />
            </z-input-group>
          </div>
        </div>
        <div class="flex justify-end mt-2">
          <button
            z-button
            zType="outline"
            zSize="sm"
            type="button"
            class="rounded-lg bg-card text-sm font-semibold"
            (click)="clearFilters()"
          >
            <span class="lucide--x text-base" aria-hidden="true"></span>
            Borrar filtros
          </button>
        </div>
      </z-accordion-item>
    </z-accordion>

  </div>

  <ng-template #searchIcon>
    <span class="ri--search-line text-base text-muted-foreground" aria-hidden="true"></span>
  </ng-template>

  <ng-template #clearSearch>
    <button
      type="button"
      class="inline-flex items-center justify-center text-muted-foreground hover:text-foreground"
      aria-label="Limpiar búsqueda"
      (click)="search.set('')"
    >
      <span class="lucide--x text-base" aria-hidden="true"></span>
    </button>
  </ng-template>

  <ng-template #contributorsIcon>
    <span>Más de</span>
  </ng-template>

  <ng-template #contributorsSuffix>
    <span class="text-sm text-muted-foreground">contribuciones.</span>
  </ng-template>
</section>
