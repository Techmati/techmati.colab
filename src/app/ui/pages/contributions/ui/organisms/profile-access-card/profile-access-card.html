<section class="space-y-2" aria-labelledby="profile-access-title">
  <h2
    id="profile-access-title"
    class="px-1 text-sm font-semibold leading-5 text-muted-foreground"
  >
    Perfil y Contribuidor
  </h2>

  <a
    routerLink="/profile"
    class="flex items-center gap-3 rounded-xl border border-border bg-card p-4 shadow-sm transition-colors hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
  >
    <span
      class="flex size-10 shrink-0 items-center justify-center rounded-full bg-primary-100 text-base font-bold text-primary-700"
      aria-hidden="true"
    >
      {{ initials() }}
    </span>

    <span class="min-w-0 flex-1">
      <span class="block truncate text-sm font-semibold leading-5 text-foreground">
        {{ name() }}
      </span>
      <span class="block truncate text-xs font-bold leading-4 text-primary">{{ handle() }}</span>
    </span>

    <span
      class="lucide--chevron-right size-4 shrink-0 text-muted-foreground"
      aria-hidden="true"
    ></span>
  </a>
</section>
