<main class="profile-page min-h-screen bg-background pb-24">
  <tm-top-app-bar />

  <section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-5 py-6">
    @if (isGuest()) {
      <tm-guest-banner />
    }

    <header class="space-y-2">
      <h1 class="font-display text-primary text-3xl font-bold leading-tight tracking-tight">
        Mis Contribuciones
      </h1>
      <p class="text-muted-foreground text-base leading-7">
        Resumen de tu impacto en la preservación del Náhuatl.
      </p>
    </header>

    <tm-profile-access-card
      [name]="displayName()"
      [handle]="handle()"
      [initials]="initials()"
    />

    <tm-profile-summary-panel />
    <tm-profile-contributions-panel />

    @if (isGuest() && recoveryCode) {
      <section
        class="flex flex-col gap-3 rounded-xl border border-border bg-card px-4 py-4 shadow-sm"
        aria-labelledby="guest-recovery-title"
      >
        <div class="flex items-center gap-2">
          <span class="lucide--key-round shrink-0 text-lg text-primary" aria-hidden="true"></span>
          <h2 id="guest-recovery-title" class="text-sm font-semibold text-primary">
            Tu código de recuperación
          </h2>
        </div>
        <p class="text-xs leading-5 text-muted-foreground">
          Si pierdes el acceso a este navegador, este código es la única forma de recuperar tu
          trabajo.
        </p>
        <code
          class="select-all rounded-sm bg-primary-100 px-3 py-2 text-center font-mono text-base font-semibold tracking-widest text-primary"
        >{{ recoveryCode }}</code>
        <button
          z-button
          zType="outline"
          zSize="sm"
          zFull
          type="button"
          (click)="copyRecoveryCode()"
        >
          @if (isCopied()) {
            <span class="lucide--check size-4" aria-hidden="true"></span>
            Código copiado
          } @else {
            <span class="lucide--copy size-4" aria-hidden="true"></span>
            Copiar código
          }
        </button>
      </section>
    }
  </section>
  <tm-bottom-nav-bar active="contributions" />
</main>
