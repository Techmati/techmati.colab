<div class="flex flex-wrap gap-1">
  @for (variant of value(); track variant) {
    <span
      class="inline-flex items-center gap-1 rounded-[10px] bg-brand-green-600 pl-1.5 pr-1 text-xs font-normal leading-4 text-white"
    >
      <span class="lucide--languages text-sm" aria-hidden="true"></span>
      {{ variant }}
      <button
        type="button"
        class="flex size-4 items-center justify-center rounded-full text-white/80 transition-colors hover:text-white focus-visible:outline-none"
        [attr.aria-label]="'Eliminar ' + variant"
        [disabled]="disabled()"
        (click)="removeVariant(variant)"
      >
        <span class="lucide--x text-xs" aria-hidden="true"></span>
      </button>
    </span>
  }

  @if (availableOptions().length > 0) {
    <select
      class="cursor-pointer appearance-none rounded-[10px] border border-border-subtle bg-card px-2 py-1 text-xs font-normal leading-4 text-text-secondary transition-colors hover:border-border focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50"
      [disabled]="disabled()"
      (change)="onSelectChange($event)"
      [value]="selectedAddOption()"
      aria-label="Añadir otra variante"
    >
      <option value="" disabled selected>Añadir otra variante</option>
      @for (option of availableOptions(); track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  }
</div>
