<div class="flex flex-col gap-3">
  <!-- Already-selected variant chips -->
  <div class="flex flex-wrap gap-1">
    @for (variant of value(); track variant.id) {
      <span
        class="h-6 inline-flex items-center gap-1 rounded-sm bg-brand-green-600 pl-1.5 pr-1 text-xs font-normal leading-4 text-white"
      >
        <span class="lucide--languages text-sm" aria-hidden="true"></span>
        {{ variant.name }}
        <button
          type="button"
          class="flex size-4 items-center justify-center rounded-full text-white/80 transition-colors hover:text-white focus-visible:outline-none"
          [attr.aria-label]="'Eliminar ' + variant.name"
          [disabled]="disabled()"
          (click)="removeVariant(variant)"
        >
          <span class="lucide--x text-xs" aria-hidden="true"></span>
        </button>
      </span>
    } @empty {
      <z-empty
        zTitle="No hay variantes"
        zDescription="Agrega al menos una variante para registrar al contribuidor."
        zIcon="lucide--languages"
      ></z-empty>
    }
  </div>

  <!-- Search + selection panel -->
  <tm-variant-search-input
    [disabled]="disabled()"
    [(selectedVariant)]="pendingVariant"
  />

  <!-- Add button -->
  <button
    z-button
    zType="outline"
    zSize="sm"
    type="button"
    class="w-full"
    [zDisabled]="!canAdd()"
    (click)="addVariant()"
  >
    <span class="lucide--plus text-base" aria-hidden="true"></span>
    Añadir variante
  </button>
</div>
