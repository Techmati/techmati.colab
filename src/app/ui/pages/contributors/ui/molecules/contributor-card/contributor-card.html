<article class="flex flex-col gap-2 rounded-xl border border-border bg-card p-4 shadow-sm">
  <h3 class="font-ui text-lg font-medium leading-7 text-foreground">{{ contributor().alias }}</h3>

  <span
    class="inline-flex w-fit items-center gap-1 rounded-md border border-border bg-muted px-2 py-1 text-xs font-medium leading-4 text-foreground"
  >
    <span [class]="statusInfo().icon" class="text-sm text-primary-600" aria-hidden="true"></span>
    {{ statusInfo().label }}
  </span>

  <ul class="flex flex-wrap gap-1">
    @for (variant of contributor().variants; track variant.id) {
      <li
        class="inline-flex items-center gap-1.5 rounded-[10px] bg-primary-600 px-1.5 py-1 text-xs font-normal leading-4 text-white"
      >
        <span class="lucide--languages text-sm" aria-hidden="true"></span>
        {{ variantName(variant) }}
      </li>
    }
  </ul>

  <z-divider zSpacing="sm"/>
  <div class="flex items-center justify-between">
    <button
      type="button"
      class="rounded-full px-4 py-1.5 text-xs font-medium leading-4 text-primary transition-colors hover:bg-primary/10 focus-visible:bg-primary/10 focus-visible:outline-none"
      (click)="onActivate()"
    >
      Activar
    </button>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="flex size-8 items-center justify-center rounded-full text-muted-foreground transition-colors hover:bg-muted hover:text-primary focus-visible:outline-none"
        [attr.aria-label]="'Editar a ' + contributor().alias"
        (click)="onEdit()"
      >
        <span class="lucide--pencil text-base" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="flex size-8 items-center justify-center rounded-full text-muted-foreground transition-colors hover:text-destructive focus-visible:outline-none"
        [attr.aria-label]="'Eliminar a ' + contributor().alias"
        (click)="onRemove()"
      >
        <span class="lucide--trash-2 text-base" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</article>
