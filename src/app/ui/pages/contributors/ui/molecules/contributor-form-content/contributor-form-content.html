<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-3">
    <label class="font-ui text-sm font-medium leading-5 text-foreground" for="name-input">
      Alias
    </label>
    <input
      id="name-input"
      z-input
      type="text"
      class="rounded-lg border border-border bg-card px-3 py-2 font-ui text-base font-normal leading-6 text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      placeholder="Alias del colaborador"
      [formField]="form.alias"
    />
    <tm-field-error-advice [field]="form.alias" />
  </div>

  <div class="flex flex-col gap-3">
    <label class="font-ui text-sm font-medium leading-5 text-foreground" for="variants-input">
      Variantes
    </label>
    <tm-contributor-variants-input id="variants-input" [formField]="form.variants" />
    <tm-field-error-advice [field]="form.variants" />
  </div>
</div>
