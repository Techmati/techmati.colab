<article
  class="active-card relative flex flex-col gap-2 rounded-xl border border-primary bg-primary/10 p-4 shadow-[0_4px_24px_rgba(83,65,205,0.15)]"
>
  <span
    class="absolute right-4 top-4 flex size-8 items-center justify-center rounded-full bg-primary text-white"
    aria-hidden="true"
  >
    <span class="lucide--check text-base font-bold"></span>
  </span>

  <h3 class="font-ui text-lg font-medium leading-7 text-primary">{{ contributor().fullName }}</h3>

  <span
    class="inline-flex w-fit items-center gap-1 rounded-md border border-border-soft bg-surface-soft px-2 py-1 text-xs font-medium leading-4 text-text-primary"
  >
    <span [class]="statusInfo().icon" class="text-sm text-brand-green-600" aria-hidden="true"></span>
    {{ statusInfo().label }}
  </span>

  <ul class="flex flex-wrap gap-1">
    @for (variant of contributor().variants; track variant) {
      <li
        class="inline-flex items-center gap-1.5 rounded-[10px] bg-brand-green-600 px-1.5 py-1 text-xs font-normal leading-4 text-white"
      >
        <span class="lucide--languages text-sm" aria-hidden="true"></span>
        {{ variant.label }}
      </li>
    }
  </ul>
</article>
