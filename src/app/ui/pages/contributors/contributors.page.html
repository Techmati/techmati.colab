<main class="contributors-page min-h-screen bg-background pb-28">
  <tm-top-app-bar />

  <section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-5 py-5">
    <tm-contributors-header [count]="total()" />

    @if (activeContributor(); as active) {
      <tm-active-contributor-card [contributor]="active" (edit)="onEdit($event)" />
    }

    <div class="flex flex-col gap-4">
      @for (contributor of inactiveContributors(); track contributor.id) {
        <tm-contributor-card
          [contributor]="contributor"
          (activate)="onActivate($event)"
          (edit)="onEdit($event)"
          (remove)="onRemove($event)"
        />
      }
    </div>
  </section>

  <button
    type="button"
    z-button
    class="new-contributor-fab fixed bottom-20 right-5 z-10 flex size-14 items-center justify-center rounded-xl bg-primary-600 text-white shadow-xl transition-transform hover:scale-105 hover:bg-primary-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
    aria-label="Nuevo contribuidor"
    (click)="onNewContributor()"
  >
    <span class="lucide--plus text-xl" aria-hidden="true"></span>
  </button>

  <tm-bottom-nav-bar active="contributors" />
</main>
