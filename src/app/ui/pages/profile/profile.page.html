<main class="profile-page min-h-screen bg-background pb-24">
  <tm-top-app-bar />

  <boneyard-skeleton name="profile-page" [loading]="isLoading()">
    <section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-5 py-6">
      <header class="space-y-2">
        <h1 class="font-display text-primary text-3xl font-bold leading-tight tracking-tight">
          Mis Contribuciones
        </h1>
        <p class="text-text-secondary text-base leading-7">
          Resumen de tu impacto en la preservación del Náhuatl.
        </p>
      </header>

      <tm-profile-summary-panel (isLoading)="summaryLoading.set($event)" />
      <tm-profile-contributions-panel (isLoading)="contributionsLoading.set($event)" />
    </section>
  </boneyard-skeleton>
  <tm-bottom-nav-bar active="profile" />
</main>
