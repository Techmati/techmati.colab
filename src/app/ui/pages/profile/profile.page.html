<main class="profile-page min-h-screen bg-background pb-12">
  <tm-profile-top-bar />

  <section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-5 py-6">
    <tm-profile-info-header
      [name]="displayName()"
      [handle]="handle()"
      [initials]="initials()"
    />

    @if (activeContributor(); as contributor) {
      <tm-profile-contributor-panel
        [contributor]="contributor"
        [isSaving]="isSavingContributor()"
        (save)="onContributorSave($event)"
      />
    } @else if (contributorLoading() || isGuest()) {
      <z-skeleton class="h-72 w-full rounded-xl" />
    }

    @if (isGuest()) {
      <tm-profile-account-panel
        [profile]="null"
        [isGuest]="true"
        [isSaving]="false"
        (save)="onAccountSave($event)"
      />
    } @else {
      @if (profile(); as profile) {
        <tm-profile-account-panel
          [profile]="profile"
          [isGuest]="false"
          [isSaving]="isSavingProfile()"
          (save)="onAccountSave($event)"
        />
      } @else if (profileLoading()) {
        <z-skeleton class="h-72 w-full rounded-xl" />
      }
    }

    <tm-profile-risk-panel
      [isDeleting]="isDeleting()"
      (deleteRequested)="onDeleteRequested()"
    />
  </section>

  <ng-template #collectorWarning>
    <p class="rounded-lg bg-destructive/10 px-3 py-2 text-sm font-medium leading-5 text-destructive">
      También se eliminarán los contribuidores que administras y todas sus contribuciones.
    </p>
  </ng-template>
</main>
