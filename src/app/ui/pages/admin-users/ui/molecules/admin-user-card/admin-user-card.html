<article
  class="flex items-center justify-between gap-3 rounded-xl border border-border bg-card p-4 shadow-sm"
>
  <div class="flex min-w-0 items-center gap-4">
    <div
      [class]="'flex size-10 shrink-0 items-center justify-center rounded-full text-base font-bold ' + avatarClasses()"
      aria-hidden="true"
    >
      {{ initials() }}
    </div>

    <div class="min-w-0 space-y-0.5">
      <h3 class="truncate text-sm font-semibold leading-5 tracking-[0.01em] text-foreground">
        {{ user().fullName }}
      </h3>
      <p class="truncate text-xs font-bold leading-4 text-brand-green-600">
        @{{ user().username }}
      </p>
      <p class="truncate text-xs font-medium leading-4 text-muted-foreground">
        {{ user().email ?? ('Miembro desde ' + (user().createdAt | date: 'dd MMM yyyy')) }}
      </p>

      <z-badge zShape="pill" class="mt-1 gap-1" [class]="roleBadgeClasses[user().role]">
        <span class="text-xs" [class]="roleIconClasses[user().role]" aria-hidden="true"></span>
        {{ roleLabels[user().role] }}
      </z-badge>
    </div>
  </div>

  <button
    z-button
    zType="ghost"
    zSize="icon"
    type="button"
    class="text-muted-foreground hover:text-primary"
    [routerLink]="['/admin', 'users', user().id]"
    [attr.aria-label]="'Ver perfil de ' + user().fullName"
  >
    <span class="lucide--chevron-right text-xl" aria-hidden="true"></span>
  </button>
</article>
