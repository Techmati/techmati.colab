<article class="rounded-xl border border-border-subtle bg-card p-6 shadow-sm">
  <header class="mb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="ri--list-check-2 text-lg text-primary" aria-hidden="true"></span>
      <h2 class="font-display text-xl font-semibold leading-7 text-primary">Frases del set</h2>
    </div>

    <span class="rounded-full bg-state-info-soft px-2 py-1 text-xs font-medium text-text-secondary">
      {{ orderedPhrases().length }} frases
    </span>
  </header>

  <div #phrasesList class="space-y-3">
    @for (phrase of orderedPhrases(); track phrase.id) {
      <tm-admin-phrase-editor-card [phrase]="phrase" />
    }
  </div>

  <button
    type="button"
    class="mt-4 flex w-full items-center justify-center gap-1 rounded-lg border-2 border-dashed border-primary bg-brand-purple-50/50 px-2 py-5 text-sm font-semibold tracking-wide text-primary"
  >
    <span class="ri--add-line text-base" aria-hidden="true"></span>
    Añadir nueva frase
  </button>
</article>
