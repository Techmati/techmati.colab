<article class="rounded-xl border border-border-subtle bg-card p-6 shadow-sm">
  <header class="mb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="ri--list-check-2 text-lg text-primary" aria-hidden="true"></span>
      <h2 class="font-display text-xl font-semibold leading-7 text-primary">Frases del set</h2>
    </div>

    <span class="rounded-full bg-state-info-soft px-2 py-1 text-xs font-medium text-text-secondary">
      {{ phrasesDrafts().length }} frases
    </span>
  </header>

  <div #phrasesList class="space-y-3">
    @if(isPending()) {
      <z-skeleton class="w-full h-29"></z-skeleton>
      <z-skeleton class="w-full h-29"></z-skeleton>
      <z-skeleton class="w-full h-29"></z-skeleton>
      <z-skeleton class="w-full h-29"></z-skeleton>
    }@else {
      @for (phrase of phrasesDrafts(); track phrase.draftId) {
        <tm-admin-phrase-editor-card
          [phrase]="phrase"
          (phraseChange)="updatePhraseDraft(phrase.draftId, $event)"
          (delete)="deletePhraseDraft(phrase.draftId)"
        />
      }@empty {
        <z-empty
          zTitle="No hay frases"
          zDescription="Agrega frases a este set para que los usuarios puedan verlas y usarlas."
          zIcon="ri--file-list-3-line"
        >
        </z-empty>
      }
    }
  </div>

  <button
    class="mt-4 w-full items-center justify-center gap-1 border-2 border-dashed border-primary bg-brand-purple-50/50 px-2 py-5 text-sm font-semibold tracking-wide text-primary hover:bg-brand-purple-100/50 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-brand-purple-500"
    z-button
    (click)="addNewPhrase()"
  >
    <span class="ri--add-line text-base" aria-hidden="true"></span>
    Añadir nueva frase
  </button>
</article>
