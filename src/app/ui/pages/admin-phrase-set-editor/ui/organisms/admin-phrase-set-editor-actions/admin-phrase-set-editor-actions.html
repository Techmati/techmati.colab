<aside
  class="fixed inset-x-0 bottom-0 z-20 border border-border bg-card p-6 shadow-lg"
  aria-label="Acciones del editor"
>
  <div class="mx-auto flex justify-center w-full max-w-3xl gap-2">
    <button
      z-button
      zType="default"
      zFull
      type="button"
      class="h-fit w-fit p-2.5 px-4 shrink rounded-lg bg-primary-600 text-sm font-medium text-white hover:bg-primary-500 hover:text-white "
      (click)="save.emit()"
      [zLoading]="saveLoading()"
      [zDisabled]="saveDisabled()"
    >
      @if (!saveLoading()) {
        <span class="lucide--save text-base" aria-hidden="true"></span>
        Guardar
      } @else {
        Guardando...
      }
    </button>

    <button
      z-button
      zType="outline"
      zFull
      type="button"
      class="h-fit w-fit p-2.5 shrink rounded-lg bg-card text-sm "
      (click)="confirmDiscard()"
    >
      <span class="lucide--x text-base" aria-hidden="true"></span>
      Descartar
    </button>
    <button
      z-button
      zType="default"
      zFull
      type="button"
      class="h-fit w-fit p-2.5 px-4 shrink rounded-lg bg-destructive text-sm font-medium text-white hover:bg-destructive/80 hover:text-white "
      (click)="delete.emit()"
      [zLoading]="deleteLoading()"
      [zDisabled]="deleteDisabled()"
    >
      @if (!deleteLoading()) {
        <span class="lucide--trash text-base" aria-hidden="true"></span>
        Eliminar
      } @else {
        Eliminando...
      }
    </button>
  </div>
</aside>
