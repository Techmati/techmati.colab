<aside
  class="fixed inset-x-0 bottom-0 z-20 border border-border-subtle bg-card p-6 shadow-lg"
  aria-label="Acciones del editor"
>
  <div class="mx-auto flex justify-center w-full max-w-3xl gap-2">
    <button
      z-button
      zType="default"
      zFull
      type="button"
      class="h-fit w-fit p-2.5 shrink rounded-lg bg-brand-green-600 text-sm font-medium text-white hover:bg-brand-green-500 hover:text-white flex-col"
    >
      <span class="lucide--save text-base" aria-hidden="true"></span>
      Guardar
    </button>

    <button
      z-button
      zType="outline"
      zFull
      type="button"
      class="h-fit w-fit p-2.5 shrink rounded-lg bg-card text-sm flex-col"
    >
      <span class="lucide--x text-base" aria-hidden="true"></span>
      Descartar
    </button>

    <button
      z-button
      zType="default"
      zFull
      type="button"
      class="h-fit w-fit p-2.5 shrink rounded-lg bg-destructive text-sm font-medium text-white hover:bg-destructive/90 hover:text-white flex-col"
    >
      <span class="lucide--trash-2 text-base" aria-hidden="true"></span>
      Eliminar
    </button>
  </div>
</aside>
