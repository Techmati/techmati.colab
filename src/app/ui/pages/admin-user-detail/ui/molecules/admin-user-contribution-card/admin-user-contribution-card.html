<article
  class="flex items-center justify-between gap-3 rounded-lg border border-border-subtle bg-card p-4 shadow-sm"
>
  <div class="min-w-0 space-y-1">
    <h3 class="truncate text-sm font-semibold leading-5 tracking-[0.01em] text-text-primary">
      {{ contribution().title }}
    </h3>
    <p class="truncate text-xs font-medium leading-4 text-text-secondary">
      {{ contribution().relativeTime }}
      <span class="px-1 text-[#c8c4d7]" aria-hidden="true">•</span>
      {{ contribution().amount }}
    </p>
  </div>

  <span class="lucide--chevron-right shrink-0 text-lg text-[#c8c4d7]" aria-hidden="true"></span>
</article>
