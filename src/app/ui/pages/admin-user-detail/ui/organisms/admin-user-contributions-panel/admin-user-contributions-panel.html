<article class="rounded-xl border border-border-subtle bg-card p-4 shadow-sm">
  <header class="mb-4 flex items-center justify-center gap-2">
    <span class="lucide--history text-xl text-primary" aria-hidden="true"></span>
    <h2 class="font-display text-xl font-semibold leading-7 text-primary">Contribuciones recientes</h2>
  </header>

  <div class="space-y-2">
    @for (contribution of contributions(); track contribution.id) {
      <tm-admin-user-contribution-card [contribution]="contribution" />
    }
  </div>

  <div class="pt-4">
    <button
      z-button
      zType="ghost"
      zFull
      type="button"
      class="h-12 text-sm font-semibold tracking-[0.01em] text-primary hover:text-primary"
    >
      Ver todas las contribuciones
      <span class="lucide--arrow-right text-base" aria-hidden="true"></span>
    </button>
  </div>
</article>
