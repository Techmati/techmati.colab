<header class="flex items-center gap-4 pb-2">
  <div
    class="flex size-[50px] shrink-0 items-center justify-center rounded-full bg-[var(--primary)] text-base font-bold text-[var(--primary-foreground)]"
    aria-hidden="true"
  >
    {{ initials() }}
  </div>

  <div class="min-w-0">
    <h2 class="truncate font-display text-2xl font-semibold leading-8 text-foreground">
      {{ user().fullName }}
    </h2>
    <p class="truncate text-base leading-6 text-muted-foreground">@{{ user().username }}</p>
  </div>
</header>
