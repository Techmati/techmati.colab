<article
  class="min-h-85 rounded-xl border border-border bg-card p-4 shadow-sm"
  role="status"
  aria-label="Cargando contribuciones disponibles"
>
  <div aria-hidden="true">
    <div class="mb-4 flex justify-center">
      <z-skeleton class="h-7 w-64 max-w-full" />
    </div>

    <div class="space-y-3">
      @for (item of [1, 2, 3]; track item) {
        <section class="space-y-3 rounded-xl border border-border bg-card p-4">
          <z-skeleton class="h-5 w-3/4" />
          <div class="flex justify-between gap-4">
            <z-skeleton class="h-4 w-20" />
            <z-skeleton class="h-4 w-36" />
          </div>
          <div class="flex justify-end">
            <z-skeleton class="h-8 w-16" />
          </div>
        </section>
      }
    </div>
  </div>
  <span class="sr-only">Cargando contribuciones disponibles</span>
</article>
