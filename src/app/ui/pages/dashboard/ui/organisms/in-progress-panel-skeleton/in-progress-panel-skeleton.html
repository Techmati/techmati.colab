<article
  class="rounded-xl border border-border bg-card p-4 shadow-sm"
  role="status"
  aria-label="Cargando contribuciones en progreso"
>
  <div aria-hidden="true">
    <div class="mb-4 flex justify-center">
      <z-skeleton class="h-7 w-36" />
    </div>

    <div class="space-y-3">
      @for (item of [1, 2]; track item) {
        <section class="space-y-3 rounded-lg bg-accent p-4">
          <z-skeleton class="h-5 w-2/3" />
          <z-skeleton class="h-4 w-1/2" />
          <div class="flex justify-between gap-4">
            <z-skeleton class="h-4 w-40" />
            <z-skeleton class="h-4 w-10" />
          </div>
          <z-skeleton class="h-1.5 w-full rounded-full" />
          <div class="flex justify-end">
            <z-skeleton class="h-9 w-28" />
          </div>
        </section>
      }
    </div>
  </div>
  <span class="sr-only">Cargando contribuciones en progreso</span>
</article>
