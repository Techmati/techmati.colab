<div class="space-y-3">
  @if (isPending()) {
    <tm-available-contributions-panel-skeleton />
  } @else if (completed().length > 0) {
    <section class="rounded-xl border border-border-subtle bg-card p-4 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="flex size-10 items-center justify-center rounded-lg bg-brand-green-200">
            <span class="lucide--refresh-cw text-xl text-brand-green-600" aria-hidden="true"></span>
          </span>
          <h2 class="font-display text-lg font-semibold leading-7 text-text-primary">
            Repetir en otra<br />variante
          </h2>
        </div>
      </div>

      <z-carousel [zControls]="'none'" class="min-w-0 overflow-hidden">
        <z-carousel-content>
          @for (task of completed(); track task.id) {
            <z-carousel-item class="basis-[90%] sm:basis-[60%] md:basis-[45%]">
              <article class="flex h-full flex-col gap-4 rounded-xl border border-border-subtle bg-surface-card p-4 shadow-sm">
                <div class="flex items-start justify-between">
                  <div class="inline-flex items-center gap-1 rounded-md bg-brand-green-200 px-2 py-1 text-xs font-medium leading-4 text-brand-green-600">
                    <span class="lucide--check" aria-hidden="true"></span>
                    Completado
                  </div>
                  <span class="lucide--check-circle text-xl text-primary" aria-hidden="true"></span>
                </div>

                <h3 class="font-ui text-base font-semibold leading-6 text-primary">
                  {{ task.phraseSet?.title ?? 'Traducción' }}
                </h3>
                <p class="text-sm font-normal leading-5 text-text-secondary">
                  @if (task.dialect) {
                    {{ task.dialect.label }} completo
                  }
                </p>

                <div class="rounded-md bg-[#eff4ff] p-3">
                  <p class="text-xs font-normal leading-4 text-text-secondary">Nueva oportunidad:</p>
                  <p class="text-sm font-normal leading-5 text-text-primary">
                    ¿Intentar en otra variante?
                  </p>
                </div>

                <button
                  z-button
                  class="mt-auto w-full"
                  (click)="openDialog(task.phraseSetId)"
                >
                  <span class="lucide--refresh-cw" aria-hidden="true"></span>
                  Nueva variante
                </button>
              </article>
            </z-carousel-item>
          }
        </z-carousel-content>
      </z-carousel>
    </section>
  }

  <tm-dialect-selection-dialog
    (translationCreated)="onTranslationCreated($event)"
    (cancelled)="void 0"
  />
</div>
