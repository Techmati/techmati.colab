<article class="rounded-xl border border-border-subtle bg-card p-4 shadow-sm">
  <header class="mb-4 flex items-center justify-center gap-2 text-xl">
    <span class="lucide--languages text-primary" ></span>
    <h2 class="font-display font-semibold leading-9 text-primary">Contribuciones disponibles</h2>
  </header>

  <div class="space-y-3">
    @for (set of phraseSets(); track set.id) {
      <section class="rounded-xl border border-border-subtle bg-surface-card p-4 shadow-sm">
        <div class="flex items-start justify-between gap-3 text-xl flex-wrap">
          <h3 class="text-secondary-foreground text-base font-medium leading-7">{{ set.title }}</h3>
        </div>
        <div class="flex justify-between">
          <p class="text-text-tertiary mt-1 text-xs leading-4">{{ set.phrasesCount }} frases</p>
          @if(set.publishedAt) {
            <p class="text-muted-foreground text-xs leading-4">{{ date(set.publishedAt || '') | date:"d 'de' MMMM yyyy" : '' : 'es-MX'}}</p>
          }@else {
            <p class="text-muted-foreground text-xs leading-4">No publicada aún</p>
          }
        </div>

        <div class="mt-3 flex justify-end">
          <button z-button zType="default" zSize="sm" class="px-3" [routerLink]="['/translate', set.id]">
            Ir
            <span class="lucide--chevron-right size-3" ></span>
          </button>
        </div>
      </section>
    }
  </div>
</article>
