<section class="rounded-lg bg-surface-success-soft p-4 flex flex-col gap-1">
  <p class="text-brand-green-600 text-sm font-semibold leading-7">
    {{ task().phraseSet?.title || ('Set #' + task().phraseSetId.slice(0, 8)) }}
  </p>
  <p class="text-text-secondary text-xs leading-4">
    {{ task().phraseCount }} frases • {{ task().lastUpdate | timeAgo }}
  </p>
  <div class="flex items-center justify-between text-xs leading-4 text-text-secondary">
    <span>{{ task().contributedEntriesCount }}/{{ task().phraseCount }} completadas</span>
    <span>{{ task().progressPercentage }}%</span>
  </div>
  <div class="h-1.5 rounded-full bg-border-subtle">
    <div
      class="h-full rounded-full bg-brand-green-600"
      [style]="{ width: task().progressPercentage + '%' }"
    ></div>
  </div>
  <div class="flex items-center justify-end gap-2">
    <button
      z-button
      zType="outline"
      (click)="continue()"
      class="border border-border text-brand-green-600 mt-1"
    >
      Continuar
      <span class="lucide--chevron-right"></span>
    </button>
  </div>
</section>
