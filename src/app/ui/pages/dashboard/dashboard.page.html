<main class="dashboard-page min-h-screen bg-background pb-28">
  <tm-top-app-bar />

  <boneyard-skeleton [loading]="isLoading()" name="dashboard-page">
    <section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-4 py-4">
      <tm-greeting-panel (loading)="isGreetingPanelLoading.set($event)" />
      <tm-in-progress-panel (loading)="isInProgressPanelLoading.set($event)" />
      <tm-available-contributions-panel
        (loading)="isAvailableContributionsPanelLoading.set($event)"
      />
    </section>
  </boneyard-skeleton>

  <tm-bottom-nav-bar active="dashboard" />
</main>
