<section
  class="rounded-2xl border border-border-subtle bg-card p-5 shadow-sm"
  aria-labelledby="admin-panels-title"
>
  <header class="mb-4 flex justify-center items-center gap-2">
    <span class="ri--dashboard-line text-xl text-primary" aria-hidden="true"></span>
    <h2 id="admin-panels-title" class="font-display text-xl font-semibold leading-7 text-primary">
      Paneles
    </h2>
  </header>

  <div class="space-y-3">
    @for (action of actions(); track action.label) {
      <tm-admin-action-card [action]="action" />
    }
  </div>
</section>
