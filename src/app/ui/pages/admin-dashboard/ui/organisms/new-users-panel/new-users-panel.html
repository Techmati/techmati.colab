<section
  class="rounded-2xl border border-border-subtle bg-card p-5 shadow-sm"
  aria-labelledby="new-users-title"
>
  <header class="mb-4 flex items-center gap-2 justify-center">
    <span class="ri--user-add-line text-xl text-primary" aria-hidden="true"></span>
    <h2 id="new-users-title" class="font-display text-xl font-semibold leading-7 text-primary">
      Nuevos usuarios
    </h2>
  </header>

  @if(usersQuery.isPending() || usersQuery.isFetching()) {
    <z-skeleton class="w-full h-21.5"></z-skeleton>
  }
  <div class="space-y-3">
    @for (user of users();  track user.username) {
      <tm-admin-user-card [user]="user" />
    }@empty{
      <!-- TODO: add empty advice -->
    }
  </div>

  <button
    z-button
    zType="ghost"
    zFull
    type="button"
    class="mt-4 h-auto justify-start rounded-2xl border border-dashed border-brand-green-300 bg-surface-success-soft p-4 text-left text-brand-green-700 hover:bg-brand-green-100 hover:text-brand-green-700"
  >
    <span
      class="flex size-11 shrink-0 items-center justify-center rounded-full bg-card text-brand-green-600"
    >
      <span class="ri--add-line text-xl" aria-hidden="true"></span>
    </span>
    <span class="flex min-w-0 flex-col">
      <span class="text-sm font-semibold leading-5">Invitar Colaborador</span>
      <span class="text-xs font-normal leading-4 text-text-secondary"
        >Añadir nuevo miembro al equipo</span
      >
    </span>
  </button>
</section>
