<section
  class="rounded-2xl border border-border-subtle bg-card p-5 shadow-sm"
  aria-labelledby="recent-contributions-title"
>
  <header class="mb-4 flex items-center gap-2">
    <span class="ri--time-line text-xl text-primary" aria-hidden="true"></span>
    <h2
      id="recent-contributions-title"
      class="font-display text-xl font-semibold leading-7 text-primary"
    >
      Últimas Contribuciones
    </h2>
  </header>

  <div class="space-y-3">
    @if(latestContributions.isPending()) {
        <z-skeleton class="w-full h-20 rounded-lg" />
        <z-skeleton class="w-full h-20 rounded-lg" />
        <z-skeleton class="w-full h-20 rounded-lg" />
    } @else {
    @for (
      contribution of contributions(); track contribution.phraseSetId + contribution.contributorId
    ) {
      <tm-recent-contribution-card [contribution]="contribution" />
    }
    }
  </div>
</section>
