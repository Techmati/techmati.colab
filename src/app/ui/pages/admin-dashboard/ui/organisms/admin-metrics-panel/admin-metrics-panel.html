<section aria-label="Métricas de administración" class="flex gap-3 flex-wrap">
  <article
    class="grow flex min-h-28 items-center gap-4 rounded-2xl border border-l-4 bg-card p-5 shadow-sm border-brand-purple-500"
  >
    <div
      class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-brand-purple-100 text-primary"
    >
      <span class="text-2xl ri--file-list-3-line" aria-hidden="true"></span>
    </div>

    <div class="min-w-0">
      <p class="text-sm font-medium leading-5 text-text-secondary">Contribuciones hoy</p>
      @if (todayStats.isPending()) {
        <z-skeleton class="w-full h-9.5"></z-skeleton>
      } @else {
        <p class="font-display text-3xl font-bold leading-tight text-text-primary">
          {{ todayStats.data()?.contributions }}
        </p>
      }
    </div>
  </article>
  <article
    class="grow flex min-h-28 items-center gap-4 rounded-2xl border border-l-4 bg-card p-5 shadow-sm border-brand-green-500"
  >
    <div
      class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-brand-green-100 text-brand-green-600"
    >
      <span class="text-2xl ri--user-add-line" aria-hidden="true"></span>
    </div>

    <div class="min-w-0">
      <p class="text-sm font-medium leading-5 text-text-secondary">Nuevos usuarios</p>
      @if (todayStats.isPending()) {
        <z-skeleton class="w-full h-9.5"></z-skeleton>
      } @else {
        <p class="font-display text-3xl font-bold leading-tight text-text-primary">
          {{ todayStats.data()?.newUsers }}
        </p>
      }
    </div>
  </article>
</section>
