<article class="flex items-start gap-3 rounded-2xl border border-border bg-card p-4">
  <div
    class="flex size-11 shrink-0 items-center justify-center rounded-full bg-brand-purple-100 text-sm font-bold text-primary"
  >
    {{ initials() }}
  </div>

  <div class="min-w-0 flex-1">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h3 class="truncate text-sm font-semibold leading-5 text-foreground">
          {{ contribution().contributorName || 'Anónimo' }}
        </h3>
        <p class="mt-1 text-xs leading-4 text-muted-foreground">
          {{ contribution().phraseSetTitle || ('Set #' + contribution().phraseSetId.slice(0, 8)) }}
          • {{ contribution().contributedEntriesCount }} entradas
        </p>
      </div>

      <time class="shrink-0 text-xs leading-4 text-muted-foreground">{{
        contribution().lastUpdate | timeAgo
      }}</time>
    </div>
  </div>
</article>
