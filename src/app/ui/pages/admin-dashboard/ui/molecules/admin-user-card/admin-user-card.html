<article
  class="flex items-center gap-3 rounded-2xl border border-border-subtle bg-surface-card p-4"
>
  <div
    class="flex size-11 shrink-0 items-center justify-center rounded-full bg-brand-green-100 text-sm font-bold text-brand-green-600"
  >
    {{ user().initials }}
  </div>

  <div class="min-w-0">
    <h3 class="truncate text-sm font-semibold leading-5 text-text-primary">
      {{ user().fullName }}
    </h3>
    <p class="truncate text-xs leading-4 text-primary">{{ user().username }}</p>
    <p class="truncate text-xs leading-4 text-text-secondary">{{ user().email }}</p>
  </div>
</article>
