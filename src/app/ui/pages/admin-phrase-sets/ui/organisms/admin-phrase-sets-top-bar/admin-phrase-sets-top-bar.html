<header class="sticky top-0 z-20 border-b border-border bg-card/95 shadow-sm backdrop-blur">
  <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between gap-3 px-5">
    <div class="flex min-w-0 items-center gap-2">
      <a
        z-button
        zType="ghost"
        zSize="icon-sm"
        routerLink="/admin/dashboard"
        aria-label="Volver al panel de administrador"
        class="text-foreground"
      >
        <span class="lucide--chevron-left text-xl" aria-hidden="true"></span>
      </a>

      <p class="font-display text-2xl font-bold leading-none tracking-tight">
        <span class="text-primary">Tech</span><span class="text-primary-600">mati</span>
      </p>
    </div>

    <div class="flex items-center gap-2">
      <span
        class="inline-flex h-8 items-center gap-1.5 rounded-lg bg-primary-500 px-3 text-sm font-medium text-white shadow-sm"
      >
        <span class="ri--shield-user-line text-base" aria-hidden="true"></span>
        Administrador
      </span>

      <button
        z-button
        zType="outline"
        zSize="icon-lg"
        type="button"
        aria-label="Cerrar sesión"
        class="bg-card text-foreground"
      >
        <span class="ri--logout-box-r-line text-xl" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
