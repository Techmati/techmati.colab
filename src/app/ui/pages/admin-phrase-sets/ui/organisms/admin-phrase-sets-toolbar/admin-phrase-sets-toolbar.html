<section class="space-y-4" aria-labelledby="admin-phrase-sets-title">
  <h1
    id="admin-phrase-sets-title"
    class="font-display text-3xl font-semibold leading-tight text-primary"
  >
    Frases
  </h1>

  <button
    z-button
    zType="default"
    zFull
    type="button"
    class="h-14 rounded-xl border-brand-green-600 bg-brand-green-600 text-sm font-semibold text-white shadow-md hover:bg-brand-green-500 hover:text-white"
  >
    <span class="ri--add-circle-line text-lg" aria-hidden="true"></span>
    Nuevo Set de Frases
  </button>

  <label class="relative block">
    <span class="sr-only">Buscar frases</span>
    <z-input-group [zAddonBefore]="searchIcon">
      <input
        z-input
        type="search"
        placeholder="Buscar..."
        class="h-9 rounded-lg bg-card pr-10 text-sm shadow-sm"
        [(ngModel)]="search"
      />
    </z-input-group>
  </label>
  <ng-template #searchIcon>
    <span class="ri--search-line text-lg text-muted-foreground" aria-hidden="true"></span>
  </ng-template>
</section>
