@let isLoading = searchResults.isPending() || searchResults.isFetching();
<section class="space-y-4 pt-2" aria-labelledby="found-phrase-sets-title">
  <header class="flex items-center justify-between gap-3">
    <h2
      id="found-phrase-sets-title"
      class="font-display text-xl font-semibold leading-7 text-primary"
    >
      Frases encontradas
    </h2>
    <p class="shrink-0 text-xs font-medium leading-4 text-text-secondary">
      @if(isLoading) {
        <span class="animate-pulse">
          Cargando
        </span>
      }@else{
        {{searchResults.data()?.total }} resultados.
      }
    </p>
  </header>
  <div class="space-y-4">
    @if(isLoading) {
      <z-skeleton class="h-28 w-full"></z-skeleton>
      <z-skeleton class="h-28 w-full"></z-skeleton>
      <z-skeleton class="h-28 w-full"></z-skeleton>
      <z-skeleton class="h-28 w-full"></z-skeleton>
    }@else{
      @for (phraseSet of searchResults.data()?.data; track phraseSet.id) {
        <tm-admin-phrase-set-card [phraseSet]="phraseSet" />
      } @empty {
        <z-empty
          zTitle="Sin conjuntos"
          zDescription="No hay conjuntos de frases que coincidan con estos filtros."
          zIcon="ri--file-text-line"
        />
      }
    }
  </div>
<!-- TODO: bind the page param to the route query params -->
  <z-pagination [zTotal]="pages()" [(zPageIndex)]="page"></z-pagination>
</section>
