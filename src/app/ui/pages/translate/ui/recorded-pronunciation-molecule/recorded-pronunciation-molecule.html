<section class="space-y-4">
  <h3 class="text-text-primary text-base font-semibold leading-5">Pronunciación</h3>

  <tm-waves-audio-player
    [audioUrl]="recordedAudio().url"
    [initialDurationSeconds]="recordedAudio().durationSeconds"
  />

  <div class="flex justify-center pt-2">
    <button type="button" class="record-btn" aria-label="Volver a grabar" (click)="onRetryClick()">
      <span class="lucide--mic size-7 text-4xl text-white" aria-hidden="true"></span>
    </button>
  </div>

  <p class="text-text-secondary text-center text-base font-semibold leading-5">Volver a grabar</p>
</section>
