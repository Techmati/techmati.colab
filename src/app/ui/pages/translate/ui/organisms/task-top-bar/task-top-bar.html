<header class="flex items-center justify-between bg-card px-5 py-4">
  <button
    type="button"
    class="inline-flex size-8 items-center justify-center rounded-full text-muted-foreground"
    aria-label="Volver"
    (click)="goBack()"
  >
    <span class="lucide--x size-5" aria-hidden="true"></span>
  </button>
  <h1 class="font-display text-primary text-xl font-semibold leading-9">Traducir</h1>
  <button
    z-button
    zType="destructive"
    zSize="icon"
    zShape="circle"
    type="button"
    aria-label="Cancelar contribución"
    (click)="cancelRequested.emit()"
  >
    <span class="lucide--trash-2 size-5" aria-hidden="true"></span>
  </button>
</header>
