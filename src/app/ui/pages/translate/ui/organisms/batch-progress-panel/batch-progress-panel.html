@let t = translation();
@if (!t) {
  <tm-batch-progress-panel-skeleton />
} @else {
  <section class="space-y-2">
    <div
      class="flex items-center justify-between text-xs font-medium leading-4 text-muted-foreground"
    >
      <span>Progreso del lote</span>
      <span>{{ t.contributedEntriesCount || 0 }} de {{ t.phraseCount }}</span>
    </div>
    <div class="h-1.5 rounded-full bg-muted">
      <div
        class="h-full rounded-full bg-primary-600 transition-[width]"
        [style]="{ width: progressPercentage() + '%' }"
      ></div>
    </div>
  </section>
}
