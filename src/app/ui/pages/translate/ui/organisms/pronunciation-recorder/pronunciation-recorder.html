<section class="space-y-4">
  <h3 class="text-foreground text-base font-semibold leading-5">Pronunciación</h3>

  @if (recordedAudio()) {
    <tm-waves-audio-player
      [audioUrl]="recordedAudio()!.url"
      [initialDurationSeconds]="recordedAudio()!.durationSeconds"
    />

    <div class="flex justify-center pt-2">
      <button type="button" class="record-btn" aria-label="Volver a grabar" [disabled]="disabled()" (click)="onRetryRecording()">
        <span class="lucide--mic size-7 text-4xl text-white" aria-hidden="true"></span>
      </button>
    </div>

    <p class="text-muted-foreground text-center text-base font-semibold leading-5">Volver a grabar</p>
  } @else {
    <div class="flex justify-center pt-2">
      <button
        type="button"
        class="record-btn"
        [class.recording]="isRecording()"
        [disabled]="disabled()"
        [attr.aria-label]="isRecording() ? 'Detener grabación' : 'Grabar pronunciación'"
        (click)="onRecordButtonClick()"
      >
        <span [class]="isRecording() ? 'lucide--square text-4xl text-white' : 'lucide--mic text-4xl text-white'" aria-hidden="true"></span>
      </button>
    </div>

    <p class="text-muted-foreground text-center text-sm font-semibold leading-5">
      {{ isRecording() ? 'Grabando... toca para detener' : 'Toca para empezar a grabar' }}
    </p>
  }

  @if (errorMessage()) {
    <p class="text-destructive text-center text-xs leading-4">{{ errorMessage() }}</p>
  }
</section>
