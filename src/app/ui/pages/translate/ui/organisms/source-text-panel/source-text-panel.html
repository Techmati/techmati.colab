<article class="rounded-xl border border-border-soft bg-card px-6 py-6 shadow-sm">
  <header class="mb-3 flex items-center gap-2">
    <span
      class="inline-flex size-6 items-center justify-center rounded-md bg-secondary text-primary"
      aria-hidden="true"
    >
      <span class="lucide--languages size-4"></span>
    </span>
    <p class="text-primary text-xs font-medium uppercase tracking-wide">
      Frase en {{ sourceLanguage() || 'español' }}
    </p>
  </header>

  <h2
    class="font-display text-text-primary text-2xl font-bold leading-tight text-center"
    [ngClass]="isLoading() ? 'animate-pulse text-muted-foreground' : ''"
  >
    {{ isLoading() ? 'Cargando...' : text() }}
  </h2>

  <z-divider zSpacing="default"></z-divider>
  <div>
    <p class="text-text-secondary text-sm font-semibold">
      <span class="lucide--circle-alert align-middle text-muted-foreground"></span>
      Contexto: {{ context() || 'Sin contexto disponible.' }}
    </p>
  </div>
</article>
