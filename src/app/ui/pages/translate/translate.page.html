<main class="min-h-screen bg-background pb-28">
  <tm-task-top-bar />

  <section class="mx-auto flex w-full max-w-sm flex-col gap-4 px-5 pb-5 pt-2">
    <tm-batch-progress-panel
      [progressPercentage]="phraseSetSummary()?.progressPercentage"
      [contributedEntriesCount]="phraseSetSummary()?.contributedEntriesCount"
      [totalPhrases]="phraseSetSummary()?.totalPhrases"
    />
    <tm-source-text-panel
      [text]="phrase()?.sourceText"
      [context]="phrase()?.context"
      [sourceLanguage]="phrase()?.sourceLanguage"
    />
    <tm-translation-input-panel [targetLanguage]="phrase()?.targetLanguage" />

    @if (showRecordedPronunciation()) {
      <tm-recorded-pronunciation-molecule />
    } @else {
      <tm-pronunciation-panel />
    }
  </section>

  <tm-bottom-action-bar />
</main>
