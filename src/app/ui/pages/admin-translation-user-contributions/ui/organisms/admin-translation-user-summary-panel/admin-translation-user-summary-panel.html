<article class="rounded-xl border border-border-subtle bg-card p-4 shadow-sm">
  @if (isLoading()) {
    <div class="flex items-center justify-between gap-4">
      <div class="flex min-w-0 flex-1 items-center gap-4">
        <div class="min-w-0 flex-1 space-y-2">
          <z-skeleton class="h-5 w-36" />
          <z-skeleton class="h-4 w-28" />
        </div>
      </div>
      <div class="w-32 space-y-2">
        <z-skeleton class="ml-auto h-8 w-20" />
        <z-skeleton class="ml-auto h-4 w-28" />
        <z-skeleton class="h-2 w-full rounded-full" />
      </div>
    </div>
  } @else {
    <div class="flex items-center justify-between gap-4">
      <div class="flex min-w-0 flex-col gap-1">
        <h2 class="text-sm font-semibold leading-5 tracking-[0.01em] text-text-primary">
          Progreso de la traducción
        </h2>
        <p class="text-xs font-medium leading-4 text-text-secondary">
          {{ progressText() }}
        </p>
      </div>

      <div class="w-32 shrink-0 text-right">
        <p class="font-display font-semibold leading-8">
          <span class="text-2xl text-primary">{{ summary()?.contributedEntriesCount ?? 0 }}</span>
          <span class="text-xl text-text-secondary"> / {{ totalPhrases() }}</span>
        </p>
        <p class="text-xs font-medium leading-4 text-text-secondary">Frases Completadas</p>
        <div class="mt-2 h-2 overflow-hidden rounded-full bg-[#d3e4fe]">
          <div class="h-full rounded-full bg-brand-green-600" [style.width]="progressWidth()"></div>
        </div>
      </div>
    </div>
  }
</article>
