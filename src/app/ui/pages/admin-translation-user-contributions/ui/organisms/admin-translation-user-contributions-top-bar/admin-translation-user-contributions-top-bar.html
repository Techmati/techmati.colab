<header class="sticky top-0 z-20 border-b border-border bg-card/95 shadow-sm backdrop-blur">
  <div class="relative mx-auto flex h-17 w-full max-w-3xl items-center justify-center px-14">
    <button
      z-button
      zType="ghost"
      zSize="icon"
      zShape="circle"
      type="button"
      class="absolute left-3 text-foreground"
      aria-label="Volver"
      (click)="goBack()"
    >
      <span class="lucide--x text-xl" aria-hidden="true"></span>
    </button>

    <div class="min-w-0 text-center text-primary">
      <p class="truncate text-base font-semibold leading-5">
        Conjunto -{{ phraseSetTitle() || 'Cargando...' }}
      </p>
      <p class="text-sm font-light leading-5">Contribuciones</p>
    </div>
  </div>
</header>
