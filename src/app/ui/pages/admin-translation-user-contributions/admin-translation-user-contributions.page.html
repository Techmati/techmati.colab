<main class="min-h-screen bg-background pb-8">
  <tm-admin-translation-user-contributions-top-bar
    [phraseSetTitle]="detailQuery.data()?.phraseSet?.title || null"
    [userName]="detailQuery.data()?.contributor?.fullName || null"
    [translationVariant]="detailQuery.data()?.translation?.dialect?.label || null"
  />

  <section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-5 py-6">
    <tm-admin-translation-user-summary-panel
      [summary]="detailQuery.data() || null"
      [isLoading]="isLoading()"
    />

    <tm-admin-translation-user-entries-panel
      [entries]="entries()"
      [dialect]="detailQuery.data()?.translation?.dialect ?? null"
      [isLoading]="isLoading()"
    />
  </section>
</main>
