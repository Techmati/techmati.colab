<main class="welcome-page min-h-screen bg-background px-5 py-10 md:py-20">
  <section class="mx-auto w-full max-w-sm">
    <tm-welcome-panel
      [isLoading]="isLoading()"
      [error]="error()"
      [success]="success()"
      (googleSignInRequested)="signInWithGoogle()"
      (passwordSignInRequested)="signInWithPassword($event)"
      (passwordSignUpRequested)="signUpWithPassword($event)"
      (modeChanged)="clearMessages()"
    />
  </section>
</main>
