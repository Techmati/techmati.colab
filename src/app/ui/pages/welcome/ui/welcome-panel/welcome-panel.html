<div class="panel bg-card text-card-foreground rounded-xl border border-border-subtle px-6 py-7 shadow-sm">
  <header class="flex flex-col items-center gap-4 text-center">
    <img
      [ngSrc]="logoUrl"
      width="128"
      height="128"
      alt="Techmati"
      class="h-32 w-32"
      priority
    />
    <h1 class="font-display text-primary text-4xl font-semibold leading-10">Bienvenido a Techmati</h1>
    <p class="text-text-secondary max-w-xs text-lg leading-7">Ingresa tu nombre para comenzar a colaborar en la comunidad.</p>
  </header>

  <form [formGroup]="form()" class="mt-8 space-y-6" (ngSubmit)="submit.emit()" novalidate>
    <ng-template #userIcon>
      <span class="lucide--user size-4 text-muted-foreground" aria-hidden="true"></span>
    </ng-template>

    <div class="space-y-2">
      <label for="username" class="text-text-secondary text-xs font-medium leading-4">Nombre de usuario</label>
      <z-input-group [zAddonBefore]="userIcon">
        <input
          id="username"
          z-input
          type="text"
          formControlName="username"
          placeholder="Ej. Xochitl Tonalli"
          autocomplete="username"
          aria-describedby="username-hint"
        />
      </z-input-group>
      <p id="username-hint" class="sr-only">Campo obligatorio para continuar.</p>
    </div>

    <button z-button zType="default" zSize="lg" zFull type="submit" class="font-semibold">
      Continuar
      <span class="lucide--arrow-right ml-1 size-4" aria-hidden="true"></span>
    </button>
  </form>
</div>
