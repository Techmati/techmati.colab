<div
  class="panel rounded-xl border border-border bg-card px-6 py-7 text-card-foreground shadow-sm"
>
  <header class="flex flex-col items-center gap-4 text-center">
    <img [ngSrc]="logoUrl" width="128" height="128" alt="Techmati" class="h-32 w-32" priority />
    <h1 class="font-display text-4xl font-semibold leading-10 text-primary">
      Bienvenido a Techmati
    </h1>
    <p class="max-w-xs text-lg leading-7 text-muted-foreground">
      Inicia sesión para comenzar a colaborar en la comunidad.
    </p>
  </header>

  <div class="mt-8">
    <z-segmented
      class="w-full"
      zAriaLabel="Selecciona una opción de autenticación"
      zDefaultValue="sign-in"
      [zOptions]="authOptions"
      (zChange)="selectMode($event)"
    />

    <div
      class="mt-5"
      role="tabpanel"
      [id]="isSignIn() ? 'sign-in-panel' : 'sign-up-panel'"
      [attr.aria-labelledby]="isSignIn() ? 'sign-in-tab' : 'sign-up-tab'"
    >
      @if (isSignIn()) {
        <tm-login-form
          [isLoading]="isLoading()"
          (submitted)="requestPasswordSignIn($event)"
          (errorMessage)="setFormError($event)"
        />
      } @else {
        <tm-signup-form
          [isLoading]="isLoading()"
          (submitted)="requestPasswordSignUp($event)"
          (errorMessage)="setFormError($event)"
        />
      }
    </div>

    @if (displayedError()) {
      <div
        class="mt-4 rounded-sm bg-destructive/20 px-3 py-1.5 text-sm text-destructive"
        role="alert"
      >
        <div class="flex items-center gap-2">
          <span class="lucide--x-circle shrink-0 text-lg" aria-hidden="true"></span>
          <span>{{ displayedError() }}</span>
        </div>
      </div>
    }

    @if (success()) {
      <div
        class="mt-4 rounded-sm bg-accent px-3 py-1.5 text-sm text-accent-foreground"
        role="status"
      >
        <div class="flex items-center gap-2">
          <span class="lucide--circle-check shrink-0 text-lg" aria-hidden="true"></span>
          <span>{{ success() }}</span>
        </div>
      </div>
    }

    <div class="my-5 flex items-center gap-3" aria-hidden="true">
      <span class="h-px flex-1 bg-border"></span>
      <span class="text-xs font-medium text-muted-foreground">O continúa con</span>
      <span class="h-px flex-1 bg-border"></span>
    </div>

    <button
      z-button
      zType="outline"
      zSize="lg"
      zFull
      type="button"
      class="font-semibold"
      [zLoading]="isLoading()"
      [zDisabled]="isLoading()"
      (click)="googleSignInRequested.emit()"
    >
      <span class="lucide--log-in size-5" aria-hidden="true"></span>
      Continuar con Google
    </button>
  </div>
</div>
