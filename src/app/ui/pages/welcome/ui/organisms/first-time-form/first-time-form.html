<form class="space-y-4" (submit)="submit($event)" novalidate>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex flex-col">
        <label class="text-sm font-medium text-muted-foreground" for="name-input">
          ¿Como te quieres identificar en techmati?
        </label>
        <input
          id="name-input"
          z-input
          type="text"
          class="rounded-lg border border-border bg-card px-3 py-2 font-ui text-base font-normal leading-6 text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          placeholder="Inserta un alias"
          [formField]="form.alias"
        />
      </div>
      <tm-field-error-advice [field]="form.alias" />
    </div>

    <div class="flex flex-col">
      <label class="text-sm font-medium text-muted-foreground" for="variants-input">
        ¿Que idiomas sabes hablar?
      </label>
      <tm-contributor-variants-input id="variants-input" [formField]="form.variants" />
    </div>
    <button z-button type="submit" [zLoading]="isLoading()" [zDisabled]="form().invalid()">
      Continuar
    </button>
  </div>
</form>
